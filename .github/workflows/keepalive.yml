# Keeps the Google sessions warm: calls the app's keep-alive route every 15 minutes (SPEC §4, session expiry).
# Needs a repository VARIABLE APP_URL (https production URL, no trailing slash) and a repository SECRET CRON_SECRET
# (same value as the CRON_SECRET environment variable on Vercel). Skipped silently while either is empty.
name: keepalive

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      APP_URL: ${{ vars.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Call keep-alive
        if: ${{ env.APP_URL != '' && env.CRON_SECRET != '' }}
        run: |
          # Print only the HTTP status line (never headers with secrets or the body). Fail the job on any non-2xx
          # (503 = at least one account is in error / needs_reauth) so GitHub emails the owner.
          status=$(curl --silent --show-error --max-time 60 --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/keepalive") || status="curl-failed"
          echo "keep-alive HTTP status: ${status}"
          case "${status}" in
            2??) ;;
            *) echo "::error::keep-alive failed (status ${status}); check the vault page for accounts that need re-import"; exit 1 ;;
          esac
